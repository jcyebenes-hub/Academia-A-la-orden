<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A LA ORDEN · Pago seguro (demo)</title>
<meta name="theme-color" content="#143d26">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%23143d26"/><path d="M14 40l18-14 18 14" stroke="%23c9971f" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 50l18-14 18 14" stroke="%23c9971f" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/></svg>'>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:Georgia,'Times New Roman',serif;background:#0f2c1b;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#fffdf5;border-radius:18px;max-width:440px;width:100%;padding:30px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;color:#143d26;font-weight:bold;font-size:20px}
.brand small{display:block;font-size:11px;letter-spacing:2px;color:#8a7a3f}
h1{font-size:19px;color:#143d26;margin-bottom:6px}
.summary{background:#f4efdd;border:1px solid #e3d9b3;border-radius:12px;padding:14px;margin:14px 0 18px;display:flex;justify-content:space-between;align-items:center;font-size:15px}
.summary b{font-size:22px;color:#1f5c38}
.note{color:#8a6d1f;font-size:13px;margin-top:6px}
label{display:block;font-size:13px;color:#5c5136;margin:12px 0 4px;font-weight:bold}
input{width:100%;padding:12px;border:1px solid #cfc49a;border-radius:10px;font-size:16px;background:#fff}
input:focus{outline:2px solid #c9971f}
.row{display:flex;gap:12px}.row>div{flex:1}
button{width:100%;margin-top:20px;background:#c9971f;color:#143d26;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:bold;cursor:pointer;font-family:inherit}
button:hover{background:#dba92e}
button:disabled{opacity:.6}
.sec{display:flex;align-items:center;gap:8px;color:#2e7d4f;font-size:13px;margin-top:14px;justify-content:center}
.demo{margin-top:14px;background:#eef7f0;border:1px dashed #2e7d4f;border-radius:10px;padding:10px;font-size:12.5px;color:#1f5c38;text-align:center}
.err{margin-top:12px;color:#b3261e;font-size:14px;display:none;text-align:center}
.small{text-align:center;font-size:12px;color:#8b8368;margin-top:14px}
a{color:#1f5c38}
</style>
</head>
<body>
<div class="box">
  <div class="brand"><svg width="34" height="34" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#143d26"/><path d="M14 40l18-14 18 14" stroke="#c9971f" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 50l18-14 18 14" stroke="#c9971f" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/></svg><span>A LA ORDEN<small>ACADEMIA DE TROPA</small></span></div>
  <h1>Finalizar suscripción</h1>
  <div class="summary"><span id="planLabel">Cargando…</span><b id="amount">—</b></div>
  <div class="note" id="note" style="display:none"></div>
  <form id="form">
    <label for="card">Número de tarjeta</label>
    <input id="card" inputmode="numeric" placeholder="4242 4242 4242 4242" autocomplete="cc-number" required>
    <label for="holder">Titular</label>
    <input id="holder" placeholder="Como aparece en la tarjeta" autocomplete="cc-name" required>
    <div class="row">
      <div><label for="exp">Caducidad</label><input id="exp" placeholder="MM/AA" autocomplete="cc-exp" required></div>
      <div><label for="cvc">CVC</label><input id="cvc" inputmode="numeric" placeholder="123" autocomplete="cc-csc" required></div>
    </div>
    <button id="payBtn" type="submit">Pagar de forma segura</button>
    <div class="err" id="err"></div>
  </form>
  <div class="demo">🧪 <b>Modo demo:</b> no se cobra nada de verdad. Usa 4242 4242 4242 4242, cualquier fecha futura y CVC.</div>
  <div class="sec">🔒 Conexión cifrada · Nunca guardamos la tarjeta completa</div>
  <p class="small">Cancela cuando quieras desde tu cuenta · <a href="/app.html#/cuenta">Volver a la app</a></p>
</div>
<script>
const params = new URLSearchParams(location.search);
const sid = params.get("s") || "";
const fmt = n => (Math.round(n * 100) / 100).toFixed(2).replace(".", ",") + " €";
fetch("/api/checkout/sid?id=" + encodeURIComponent(sid)).then(r => r.json()).then(d => {
  if (d.error) { document.getElementById("planLabel").textContent = d.error; document.getElementById("payBtn").disabled = true; return; }
  document.getElementById("planLabel").textContent = d.plan + (d.cycle === "single" ? " · pago único" : " · mensual");
  document.getElementById("amount").textContent = d.amount === 0 ? "GRATIS" : fmt(d.amount);
  if (d.note) { const n = document.getElementById("note"); n.textContent = "🏷️ " + d.note; n.style.display = "block"; }
});
document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const btn = document.getElementById("payBtn"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Procesando…"; err.style.display = "none";
  fetch("/api/checkout/confirm", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: sid, card: { number: document.getElementById("card").value, holder: document.getElementById("holder").value, exp: document.getElementById("exp").value, cvc: document.getElementById("cvc").value } })
  }).then(r => r.json()).then(d => {
    if (d.ok) location.href = "/app.html#/cuenta?bienvenida=pro";
    else { err.textContent = d.error || "No se pudo procesar el pago"; err.style.display = "block"; btn.disabled = false; btn.textContent = "Pagar de forma segura"; }
  }).catch(() => { err.textContent = "Error de red"; btn.disabled = false; });
});
</script>
</body>
</html>
